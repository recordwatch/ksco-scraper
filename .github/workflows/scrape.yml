name: Scrape Jail Roster

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      allow_large_drop:
        description: 'Let a real mass release through the drop guard (this run only)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# Two runs pushing to main at once would clobber each other's data commit.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # A failed install or scrape doesn't end the run here. The health step
      # below decides whether it's been broken long enough to fail (and email).
      - name: Install backend deps
        id: install
        continue-on-error: true
        run: npm install

      - name: Run scraper
        id: scrape
        continue-on-error: true
        env:
          # Empty on scheduled runs and unless the box is ticked on a manual run.
          ALLOW_LARGE_DROP: ${{ inputs.allow_large_drop && '1' || '' }}
        run: node scrape.js

      - name: Record scraper health
        id: health
        run: |
          if [ "${{ steps.install.outcome }}" = success ] && [ "${{ steps.scrape.outcome }}" = success ]; then
            bash .github/scripts/scrape-health.sh success
          else
            bash .github/scripts/scrape-health.sh failure
          fi

      # Commit the scrape before anything that can fail. A frontend build error
      # used to throw away the run's data entirely. A commit that gives up
      # (see below) is a warning: the next run re-scrapes and commits.
      - name: Commit updated data files
        if: '!cancelled()'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/change_log.json data/roster.json data/stats.json data/status.json .github/scrape-health.json
          git diff --cached --quiet && echo "No data changes to commit." && exit 0
          git commit -m "chore: scrape $(date -u '+%Y-%m-%d %H:%M UTC')"
          # If main moved while we scraped, rebase onto it, but only when the new
          # commits leave data/ alone. Merging two versions of the data files would
          # silently drop one side, so in that case fail and let the next run
          # re-scrape from the newer data.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "Push rejected (attempt $attempt)."
            git fetch origin main
            if ! git diff --quiet HEAD~1 origin/main -- data/; then
              echo "main has new changes under data/ since this run started. Not merging them" >&2
              echo "with this run's data; the next run will scrape from the newer files." >&2
              exit 1
            fi
            git rebase --onto origin/main HEAD~1 || { git rebase --abort; exit 1; }
            sleep $((attempt * 5))
          done
          echo "Could not push data commit after 3 attempts." >&2
          exit 1

      - name: Fail if the scraper has been broken for 24 hours
        if: steps.health.outputs.fail == 'true'
        run: exit 1

  # Publishing problems never fail the workflow; the next run republishes.
  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Copy data files into frontend public
        run: |
          mkdir -p frontend/public/data
          cp data/change_log.json frontend/public/data/
          cp data/stats.json frontend/public/data/
          cp data/status.json frontend/public/data/

      - name: Install frontend deps
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          force_orphan: true
